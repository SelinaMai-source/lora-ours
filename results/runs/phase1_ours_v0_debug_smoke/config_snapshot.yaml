__config_path__: /root/lora-ours/configs/phase1/ours_v0_debug_smoke.yaml
debug:
  max_eval_examples_per_segment: 1
  max_segments: 2
  max_train_examples_per_segment: 2
  model_loading: dummy
experiment_name: phase1_ours_v0_debug_smoke
lora:
  alpha: 8
  dropout: 0.0
  enabled: false
  r: 4
  target_modules: []
mode: debug
model:
  backbone_name: debug-text
  device: cpu
  gen_do_sample: false
  gen_max_new_tokens: 32
  gen_num_beams: 1
  hf_model_name_or_path: ''
  max_seq_len: 128
  torch_dtype: float32
output:
  run_name: phase1_ours_v0_debug_smoke
  save_every_segment: true
  tracking:
    use_wandb: false
    wandb_group: v0_setup
    wandb_mode: offline
    wandb_project: lora-ours-phase1
    wandb_tags:
    - phase1
    - debug_smoke
    - not_benchmark
  write_logs: true
  write_tables: true
paper:
  benchmark_alias: toy_smoke
  category: pipeline_healthcheck
  method_variant: debug_pipeline_only
  note: Toy smoke config for pipeline health only; never report as CITB/PEFT/MultiWOZ
    result.
  strict_benchmark_result: false
  track: phase1_setup
paths:
  assets_dir: assets
  project_root: .
  results_dir: results
  sample_stream_path: data/sample/ours_v0_smoke_stream.json
seed: 123
train:
  batch_size: 1
  epochs_per_segment: 1
  grad_clip_norm: 1.0
  hard_early_stop_enabled: true
  hard_early_stop_min_seen_avg: 0.0
  log_every: 1
  lr: 0.001
  trajectory_early_stop: false
  weight_decay: 0.0
