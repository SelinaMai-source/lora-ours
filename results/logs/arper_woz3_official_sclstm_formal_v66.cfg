[EXPERIMENT]
experiment_prefix = /root/lora-ours/results/runs/arper_woz3_official_sclstm_formal_v66/
exemplar_selection = herding,random,loss
experiment = exemplar_ewc_loss_250_formal_v66

[DATA]
text_dir = ./data/woz3/text/
label_dir = ./data/woz3/acts/
vocab_file = ./resource/woz3/vocab.txt
feat_file = ./resource/woz3/feat_unique_da.json
text_file = ./resource/woz3/text_unique_da.json
template_file = ./resource/woz3/template.txt
data_split = ./resource/woz3/data_split/all_unique_da_datasplit.json
shuffle = true
batch_size = 64
granularity = 1
sent_max_len = true
task_seq = 1,7,0,6,4,2,8

[MODEL]
model_type = lm
dec_type = sclstm
train_percentage = 1
num_layer = 1
hidden_size = 128
clip = 0.5
std = 1
full_kl_step = 5000
latent_size = 128

[TRAINING]
n_epochs = 100
save_exemplars = true

[TESTING]
beam_size = 1
output_log = False

[EXEMPLARS]
exemplar_size = 250
fixed_size_exemplar = True
