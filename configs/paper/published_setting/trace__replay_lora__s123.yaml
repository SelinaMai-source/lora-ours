experiment_name: published_setting_trace_replay_lora
mode: baseline
seed: 123
paths:
  project_root: .
  processed_stream_dir: data/processed
  processed_stream_file: trace_cl_tasks_train50_eval10.json
  raw_citb_root: data/raw/citb
  assets_dir: assets
  results_dir: results
data:
  stream_format: trace_processed
  stream_name: trace
  auto_prepare_processed: false
  processed_stream_train_instances_per_task: 50
  processed_stream_eval_instances_per_task: 10
  processed_stream_limit_tasks: -1
  max_segments: -1
  max_train_examples_per_segment: -1
  max_eval_examples_per_segment: -1
  split: default
model:
  backbone_name: llama31-8b-instruct
  hf_model_name_or_path: assets/pretrained/meta-llama/Llama-3.1-8B-Instruct
  torch_dtype: bfloat16
  device: auto
  max_seq_len: 512
  gen_max_new_tokens: 64
  gen_do_sample: false
  gen_num_beams: 1
  mask_eos_token_in_labels: true
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - v_proj
train:
  epochs_per_segment: 1
  batch_size: 2
  lr: 0.0002
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 25
  trajectory_early_stop: false
  hard_early_stop_enabled: false
baseline_name: replay_lora
replay:
  enabled: true
  buffer_size: 50
  replay_ratio: 0.3
  strategy: uniform
output:
  run_name: trace_full_replay_lora_s123
  save_every_segment: true
  write_tables: true
  write_logs: true
  tracking:
    use_wandb: true
    wandb_project: lora-published-setting-run_v2
    wandb_group: published_setting_trace
    wandb_mode: online
    wandb_tags:
    - published_setting
    - trace
    - replay_lora
    - seed_123
    - train50_eval10
    - full_8segment
    - run_v2
    wandb_notes: 'Published-setting v2 full TRACE: 8 segments train50/eval10, method=replay_lora,
      seed=123'
    log_artifacts: true
paper:
  track: published_setting
  category: basic_baseline_single_seed
  benchmark_alias: trace
  method_variant: replay_lora
  memory_budget: 50
  family: baseline
  published_setting_note: TRACE full 8-segment train50/eval10; 3H delta via trace_three_h_delta
    stub
