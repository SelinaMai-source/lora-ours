experiment_name: published_setting_instrdialog_progressive_prompts
mode: baseline
seed: 123
baseline_name: progressive_prompts
paths:
  project_root: .
  processed_stream_dir: data/processed
  processed_stream_file: citb_cl_dialogue_tasks_train50_eval10.json
  assets_dir: assets
  results_dir: results
data:
  stream_format: citb_processed
  split: default
  max_segments: -1
  max_train_examples_per_segment: -1
  max_eval_examples_per_segment: -1
  stream_name: instrdialog
  auto_prepare_processed: false
model:
  backbone_name: llama31-8b-instruct
  hf_model_name_or_path: assets/pretrained/meta-llama/Llama-3.1-8B-Instruct
  torch_dtype: bfloat16
  device: auto
  max_seq_len: 512
  gen_max_new_tokens: 64
  gen_do_sample: false
  gen_num_beams: 1
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - v_proj
train:
  epochs_per_segment: 1
  batch_size: 2
  lr: 0.0002
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 25
advanced_baseline:
  progressive_prompts:
    prompt_prefix: pp_s
    prompt_length: 20
    freeze_previous_prompts: true
output:
  run_name: published_instrdialog_progressive_prompts_s123
  save_every_segment: true
  write_tables: true
  write_logs: true
  tracking:
    use_wandb: true
    wandb_project: lora-published-setting-run_v2
    wandb_group: published_setting_instrdialog
    wandb_mode: online
    wandb_tags:
    - published_setting
    - instrdialog
    - progressive_prompts
    - seed_123
    - train50_eval10
    wandb_notes: 'Published-setting single-seed run: InstrDialog train50/eval10, method=progressive_prompts,
      seed=123'
    log_artifacts: true
paper:
  track: published_setting
  category: advanced_baseline_single_seed
  benchmark_alias: instrdialog
  method_variant: progressive_prompts
  memory_budget: 0
  family: advanced_baseline
  published_setting_note: InstrDialog train50/eval10
