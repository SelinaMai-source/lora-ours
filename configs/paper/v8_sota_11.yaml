experiment_name: paper_ours_instrdialog
mode: ours
seed: 123
paths:
  project_root: .
  processed_stream_dir: data/processed
  processed_stream_file: ''
  raw_citb_root: data/raw/citb
  assets_dir: assets
  results_dir: results
data:
  stream_format: citb_processed
  stream_name: instrdialog
  auto_prepare_processed: true
  processed_stream_train_instances_per_task: 50
  processed_stream_eval_instances_per_task: 10
  processed_stream_limit_tasks: -1
  max_segments: -1
  max_train_examples_per_segment: -1
  max_eval_examples_per_segment: -1
model:
  backbone_name: llama31-8b-instruct
  hf_model_name_or_path: assets/pretrained/meta-llama/Llama-3.1-8B-Instruct
  torch_dtype: bfloat16
  device: auto
  max_seq_len: 512
  gen_max_new_tokens: 64
  gen_do_sample: false
  gen_num_beams: 1
  mask_eos_token_in_labels: true
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - v_proj
train:
  epochs_per_segment: 1
  batch_size: 2
  lr: 0.0002
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 25
  trajectory_early_stop: true
  trajectory_baseline: v6_sota_2
  trajectory_margin: 0.05
output:
  run_name: paper_instrdialog_ours_full_s123_v8_sota_11
  save_every_segment: true
  write_tables: true
  write_logs: true
  tracking:
    use_wandb: true
    wandb_project: lora-citb-sota
    wandb_group: v8_sota
    wandb_tags:
    - v8_sota_11
    - ours_full
    - prototype_router
    - spawn_sync_prototype
    - prototype_multi_step
    - router_warmup2
    wandb_notes: 'v8_sota_11: v8_sota_5 champion base (spawn-sync + 3-pass + soft routing).
      Single change: router_warmup_segments 1->2 — defer prototype routing until seg2.
      Motivation: v8_10 beta=0.07 failed to beat champion; seg9 fallback_to_active=49/50
      shows premature routing; extend warmup for prototype stabilization.'
modules:
  use_drift_detector: true
  use_lora_bank: true
  use_router: true
  use_overlap_loss: true
drift:
  anchor_size: 64
  anchor_source: train
  curriculum_strategy: easy_core_hard_probe
  anchor_refresh_segments: 1
  monitor_interval: 50
  calibration_window: 1
  threshold: 0.025
  score_ema: 0.0
  shift_stat: absolute
  min_consecutive_probe_hits: 1
  force_spawn_on_segment_boundary: false
  meta_threshold_enabled: false
  meta_threshold_scale: 1.0
  meta_threshold_min: 0.05
  meta_threshold_max: 1.0
bank:
  max_branches: 15
  spawn_on_drift: true
  freeze_old_branches: true
router:
  hard_routing: true
  soft_routing: true
  soft_routing_temperature: 0.08
  soft_routing_top_k: 3
  pseudo_label_strategy: self_consistency
  temperature: 1.0
  router_warmup_segments: 2
  margin_filter_min_gap: 0.02
  learning_rate: 0.008
  training_strategy: learned_router
  training_fallback_to_active: true
  train_frozen_branches: false
  balance_beta: 0.02
  orthogonal_head_beta: 0.02
  routing_backend: prototype
  prototype_ema: 0.8
  spawn_sync_prototype_init: true
  prototype_update_steps: 3
overlap:
  beta: 0.05
  warmup_segments: 1
  min_branches: 2
  branch_scale: none
  activation_beta_ratio: 0.6
  weight_beta_ratio: 0.4
  weight_similarity: abs_cosine
paper:
  track: paper
  category: main
  benchmark_alias: instrdialog
  method_variant: winner_ours_full
  memory_budget: 0
  family: ours
