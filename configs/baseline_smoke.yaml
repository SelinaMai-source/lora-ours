experiment_name: "citb_baseline_smoke"
mode: "baseline"  # debug | baseline | ours

seed: 123

baseline_name: "sequential_lora"

paths:
  project_root: "."
  processed_stream_dir: "data/processed"
  processed_stream_file: "citb_cl_dialogue_tasks_train50_eval10.json"
  assets_dir: "assets"
  results_dir: "results"

data:
  stream_format: "citb_processed"
  max_segments: 2
  max_train_examples_per_segment: 10
  max_eval_examples_per_segment: 5

model:
  backbone_name: "llama31-8b-instruct"
  hf_model_name_or_path: "assets/pretrained/meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  device: "auto"
  max_seq_len: 512
  gen_max_new_tokens: 32

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

train:
  epochs_per_segment: 1
  batch_size: 1
  lr: 2.0e-4
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 10

output:
  run_name: "smoke"
  save_every_segment: true
  write_tables: true
  write_logs: true

