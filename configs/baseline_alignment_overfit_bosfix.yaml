experiment_name: "citb_baseline_alignment_overfit"
mode: "baseline"

seed: 123
baseline_name: "sequential_lora"

paths:
  project_root: "."
  processed_stream_dir: "data/processed"
  processed_stream_file: "citb_cl_dialogue_tasks_train50_eval10.json"
  assets_dir: "assets"
  results_dir: "results"

data:
  stream_format: "citb_processed"
  max_segments: 1
  max_train_examples_per_segment: 8
  max_eval_examples_per_segment: 8

model:
  backbone_name: "llama31-8b-instruct"
  hf_model_name_or_path: "assets/pretrained/meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  device: "auto"
  max_seq_len: 256
  gen_max_new_tokens: 160
  debug_print_formatted_examples: true
  debug_print_tokenized_examples: true
  debug_max_tokenized_examples: 2
  debug_nan_guard: true
  debug_nan_dump_dir: "results/runs/baseline_alignment_overfit_bosfix/nan_debug"
  debug_alignment_dump_dir: "results/runs/baseline_alignment_overfit_bosfix/debug/alignment"
  min_target_tokens_for_loss: 16
  enable_scheduled_sampling_prefix_mixing: false
  scheduled_sampling_prefix_k: 0
  scheduled_sampling_apply_every_n_steps: 1
  scheduled_sampling_debug_log: true

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

train:
  epochs_per_segment: 1
  batch_size: 1
  lr: 2.0e-4
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 10

eval_normalization:
  strip_whitespace: true
  lowercase: true
  remove_special_tokens: true
  remove_prompt_prefix: false

debug_tools:
  enable_overfit_8_mode: true
  overfit_decode_ablation_only: false
  overfit_decode_ablation_ckpt: "lora_ckpt/step_000020"
  overfit_fresh_start: true
  overfit_segment_index: 0
  overfit_steps: 20
  overfit_log_every: 5
  overfit_batch_size: 1
  overfit_gen_max_new_tokens: 160
  enable_sequence_behavior_diagnosis: true
  run_failure_decomposition: true
  run_first_token_audit: true
  first_token_gold_source: "supervised_span"
  run_prefix_rollout: false
  run_decode_ablation: true
  run_overfit_ladder: false
  stop_after_overfit_mode: true
  enable_single_segment_mode: true
  single_segment_index: 0

output:
  run_name: "baseline_alignment_overfit_bosfix"
  save_every_segment: true
  write_tables: true
  write_logs: true
