experiment_name: "citb_advanced_baselines"
mode: "baseline"
seed: 123

# Scaffold / smoke-test-ready:
# adapter-per-segment wiring plus executable orthogonal regularization/projection hooks.
baseline_name: "o_lora"

paths:
  project_root: "."
  processed_stream_dir: "data/processed"
  processed_stream_file: "citb_cl_dialogue_tasks_train50_eval10.json"
  assets_dir: "assets"
  results_dir: "results"

data:
  stream_format: "citb_processed"
  split: "default"
  max_segments: -1
  max_train_examples_per_segment: -1
  max_eval_examples_per_segment: -1

model:
  backbone_name: "llama31-8b-instruct"
  hf_model_name_or_path: "assets/pretrained/meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  device: "auto"

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

train:
  epochs_per_segment: 1
  batch_size: 2
  lr: 2.0e-4
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 50

advanced_baseline:
  o_lora:
    adapter_prefix: "olora_s"
    freeze_previous_adapters: true
    orthogonal_penalty_weight: 0.1
    orthogonal_projection_strength: 1.0

output:
  run_name: "o_lora_scaffold"
  save_every_segment: true
  write_tables: true
  write_logs: true
