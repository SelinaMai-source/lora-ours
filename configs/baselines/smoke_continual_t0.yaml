experiment_name: "citb_advanced_baselines"
mode: "debug"
seed: 123

# Scaffold / smoke-test-ready only:
# uses instruction rehearsal wiring, not the original T0/T5 checkpoint or mixture.
baseline_name: "continual_t0"

paths:
  project_root: "."
  sample_stream_path: "data/sample/mock_stream.json"
  processed_stream_dir: "data/processed"
  processed_stream_file: "citb_cl_dialogue_tasks_train50_eval10.json"
  assets_dir: "assets"
  results_dir: "results"

data:
  stream_format: "citb_processed"
  split: "default"
  max_segments: 2
  max_train_examples_per_segment: 2
  max_eval_examples_per_segment: 2

model:
  backbone_name: "llama31-8b-instruct"
  hf_model_name_or_path: "assets/pretrained/meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  device: "auto"

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

train:
  epochs_per_segment: 1
  batch_size: 2
  lr: 2.0e-4
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 50

replay:
  enabled: true
  buffer_size: 256
  replay_ratio: 0.01
  strategy: "uniform"

advanced_baseline:
  continual_t0:
    buffer_size: 256
    replay_ratio: 0.01
    strategy: "uniform"

output:
  run_name: "smoke_continual_t0"
  save_every_segment: true
  write_tables: true
  write_logs: true

# Debug mode uses baseline.baseline_name for method selection.
baseline:
  baseline_name: "continual_t0"

debug:
  model_loading: "dummy"
  max_segments: 2
  max_train_examples_per_segment: 2
  max_eval_examples_per_segment: 2
