experiment_name: standard_peft_cl_o_lora_standard_order1_seed1_ours_strict_v67_replay_retention_t20_e16_ep3_accum2_noreplay_repeat
mode: ours
seed: 1
strict_alignment:
  status: ready
  blocker: ''
