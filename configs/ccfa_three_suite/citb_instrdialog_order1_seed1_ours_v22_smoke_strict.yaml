experiment_name: citb_instrdialog_order1_seed1_ours_v22_smoke_strict
mode: ours
seed: 1
strict_alignment:
  status: smoke_from_strict
  blocker: ''
  official_evidence: Same official stream/model/training settings as v21 strict-smoke; only max_segments is truncated for early-gate.
paths:
  project_root: /root/lora-ours
  processed_stream_dir: /root/autodl-tmp/lora-baselines-run_v1/data/ccfa_three_suite/citb
  processed_stream_file: /root/autodl-tmp/lora-baselines-run_v1/data/ccfa_three_suite/citb/citb_instrdialog_order1_train500_dev50_test100.json
  results_dir: /root/lora-ours/results
data:
  suite: CITB
  benchmark: InstrDialog-order1
  stream_format: unified_ccfa_stream
  ready: true
  max_segments: 4
model:
  architecture: seq2seq_lm
  task_type: seq2seq_lm
  backbone: T5-small LM-adapted + 100 SuperNI init
  hf_model_name_or_path: /root/autodl-tmp/model_cache/citb_superni_stage1/base_epoch15_lr1e-05_seed469
  base_model_path: /root/autodl-tmp/model_cache/citb_superni_stage1/base_epoch15_lr1e-05_seed469
  format_style: citb_t5
  torch_dtype: bfloat16
  device: auto
  max_source_len: 1024
  max_target_len: 128
  gen_max_new_tokens: 128
  gen_num_beams: 1
  gen_do_sample: false
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q
    - v
train:
  lr: 1.0e-05
  epochs_per_segment: 15
  batch_size: 8
  hard_early_stop_enabled: true
  hard_early_stop_min_seen_avg: 0.10
  early_stop_min_segment: 3
  early_stop_min_task_aware_score: 0.10
  ours_v10_early_stop: true
  ours_v10_check_segments:
    - 2
    - 3
modules:
  use_drift_detector: true
  use_lora_bank: true
  use_router: true
  use_overlap_loss: true
drift:
  kalman_drift_enabled: true
  kalman_process_var: 0.02
  kalman_measure_var: 0.25
  anchor_source: train
  anchor_size: 64
  anchor_candidate_pool_size: 256
  calibration_window: 1
  threshold: 0.005
  probe_threshold_scale: 0.9
  core_threshold_scale: 1.0
assess_update:
  isolated_energy_threshold: 0.12
router:
  routing_backend: prototype
  training_strategy: learned_router
  router_warmup_segments: 1
  prototype_calibration: true
  prototype_calibration_prior: 8.0
  nll_arbitration: true
  arbitration_margin: 0.2
  arbitration_top_k: 2
  spawn_sync_prototype_init: true
  segment_anchor_prototype_refresh: true
  anchor_prototype_refresh_beta: 0.35
  prototype_update_steps: 2
  margin_filter_min_gap: 0.005
  task_aware_fallback: true
  task_aware_fallback_force_assigned: true
  task_aware_fallback_min_confidence: 0.78
  task_aware_fallback_min_margin: 0.18
  force_active_branch_on_spawn_segment: true
  oracle_pll_recalibrate: true
  oracle_pll_min_agreement: 0.5
  oracle_pll_bonus_steps: 1
spectral_replay:
  enabled: true
  buffer_size: 768
  replay_ratio: 0.2
  min_replay_per_segment: 8
  spectral_top_k: 8
  spectral_energy_threshold: 0.85
overlap:
  beta: 0.12
eval_normalization:
  enable_task_aware_score: true
  task_score_metric: rouge_l
  task_score_match_threshold: 0.35
  auto_short_answer_max_new_tokens: false
output:
  run_name: citb_instrdialog_order1_seed1_ours_v22_smoke_strict
  tracking:
    use_wandb: true
    wandb_project: lora-ours-v22
    wandb_group: ccfa_citb_strict_ours_v22_smoke
    wandb_mode: online
    wandb_tags:
      - ccfa_v2
      - citb
      - strict-smoke
      - ours_v22
paper:
  strict_ready: false
  status: early_gate_only
  method_variant: ours_v22_generation_effective_active_spawn_training
  metrics:
    - early segment ROUGE-L task-aware score
    - current-task generation effectiveness
    - routed training branch counts
  notes: Smoke run for early-gating only. V22 keeps v21 eval routing fixes but forces a freshly spawned current-task branch to receive the segment training updates, addressing v21 evidence where segment 2 generated question-like outputs after training mostly on old branch b1. It must not be reported as full CITB SOTA.
