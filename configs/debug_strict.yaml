data:
  benchmark: InstrDialog-order1
  ready: true
  stream_format: unified_ccfa_stream
  suite: CITB
eval_normalization:
  auto_short_answer_max_new_tokens: false
  enable_task_aware_score: true
experiment_name: citb_instrdialog_order1_seed1_ours_strict
lora:
  alpha: 32
  dropout: 0.05
  enabled: true
  r: 16
  target_modules:
  - q
  - v
mode: ours
model:
  architecture: seq2seq_lm
  backbone: T5-small LM-adapted + 100 SuperNI init
  base_model_path: /root/autodl-tmp/model_cache/citb_superni_stage1/base_epoch15_lr1e-05_seed469
  debug_print_formatted_examples: true
  debug_print_tokenized_examples: true
  device: auto
  gen_do_sample: false
  gen_max_new_tokens: 128
  gen_num_beams: 1
  hf_model_name_or_path: /root/autodl-tmp/model_cache/citb_superni_stage1/base_epoch15_lr1e-05_seed469
  max_source_len: 1024
  max_target_len: 128
  task_type: seq2seq_lm
  torch_dtype: bfloat16
modules:
  use_drift_detector: true
  use_lora_bank: true
  use_overlap_loss: true
  use_router: true
official_reference:
  base_model_name: google/t5-small-lm-adapt
  debug_max_segments: 1
  debug_print_formatted_examples: true
  debug_print_tokenized_examples: true
  local_base_model_path: /root/autodl-tmp/model_cache/hf_snapshots/google__t5-small-lm-adapt
  required_stage1_checkpoint: /root/autodl-tmp/model_cache/citb_superni_stage1/base_epoch15_lr1e-05_seed469
  stage1_command: tmux new-session -s ccfa_citb_stage1_superni /root/Lora-Baselines/docs/scripts/run_citb_stage1_superni_official_wrapper.sh
  stage1_instances_per_task: 100
  stage1_train_tasks: 100
  stage2_epochs: 15
  stage2_learning_rate: 1e-05
output:
  run_name: citb_instrdialog_order1_seed1_ours_strict
  tracking:
    use_wandb: false
paper:
  metrics:
  - ROUGE-L AR
  - FWT
  - BWT
  - Tinit
  - Tunseen
  notes: Official Stage-1 SuperNI checkpoint completed; Stage-2 uses official InstrDialog
    short-stream split train500/dev50/test100 and ROUGE-L CL metrics.
  postprocess: ccfa_postprocess/summary.json
  status: ready
  strict_ready: true
paths:
  processed_stream_dir: /root/autodl-tmp/lora-baselines-run_v1/data/ccfa_three_suite/citb
  processed_stream_file: /root/autodl-tmp/lora-baselines-run_v1/data/ccfa_three_suite/citb/citb_instrdialog_order1_train500_dev50_test100.json
  project_root: /root/Lora-Baselines
  results_dir: /root/autodl-tmp/lora-baselines-run_v1/results
seed: 1
strict_alignment:
  blocker: ''
  official_evidence: CITB README; scripts/run_initial_multitask_tuning.sh; scripts/*_stream_scripts/run_cit_ft_instr.sh;
    collect_results.py; data/CIT_data/task_orders
  status: ready
train:
  batch_size: 8
  epochs_per_segment: 1
  hard_early_stop_enabled: false
  lr: 1e-05
