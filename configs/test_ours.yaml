experiment_name: "test_ours"
mode: "ours"

seed: 42

paths:
  project_root: "."
  sample_stream_path: "data/sample/mock_stream.json"
  processed_stream_dir: "data/processed"
  processed_stream_file: "citb_cl_38_random_tasks_train50_eval10.json"
  assets_dir: "assets"
  results_dir: "results"

debug:
  model_loading: "dummy"
  max_segments: 3
  max_train_examples_per_segment: 12
  max_eval_examples_per_segment: 8

model:
  backbone_name: "llama3"
  hf_model_name_or_path: "/root/autodl-tmp/Lora-code/assets/pretrained/meta-llama/Llama-3.1-8B-Instruct"

lora:
  enabled: true
  r: 4
  alpha: 8
  dropout: 0.0
  target_modules: ["q_proj", "v_proj"]

train:
  epochs_per_segment: 1
  batch_size: 4
  lr: 0.3
  weight_decay: 0.0
  log_every: 10

output:
  run_name: "test_ours"

drift:
  anchor_size: 16
  monitor_interval: 1
  threshold: 0.15
  score_ema: 0.9

router:
  learning_rate: 1.0e-3

overlap:
  beta: 0.1

modules:
  use_drift_detector: true
  use_lora_bank: true
  use_router: true
  use_overlap_loss: true
